# ──────────────────────────────────────────────────────────────────
# Project Aegis — Autonomous Contract Synchronization
# ──────────────────────────────────────────────────────────────────
# Triggered when a PR is opened/updated on the backend repository.
# Detects breaking API contract changes and automatically generates
# a synchronized PR on the frontend repository with updated types.
# ──────────────────────────────────────────────────────────────────

name: "🛡️ Project Aegis — Contract Sync"

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'src/server.ts'   # Only trigger when the API source file changes

permissions:
  contents: read
  pull-requests: write

jobs:
  aegis-sync:
    name: "Detect & Sync Frontend Contracts"
    runs-on: ubuntu-latest
    timeout-minutes: 15   # Hard timeout to prevent runaway agent loops

    env:
      REPO_B_PATH: ./repo-b
      MCP_PORT: "3002"
      FRONTEND_REPO: Aegis-Enclave/repo-b-frontend

    steps:
      # ═══════════════════════════════════════════════════
      # STAGE 1: Environment Setup
      # ═══════════════════════════════════════════════════

      - name: "📥 Checkout Repo A (Backend)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history needed for accurate git diff

      - name: "📥 Clone Repo B (Frontend) into ./repo-b"
        run: |
          echo "::group::Cloning frontend repository"
          git clone \
            --depth 1 \
            https://x-access-token:${{ secrets.FRONTEND_REPO_PAT }}@github.com/${{ env.FRONTEND_REPO }}.git \
            ${{ env.REPO_B_PATH }}
          echo "::endgroup::"
          echo "✅ Repo B cloned to ${{ env.REPO_B_PATH }}"
          ls -la ${{ env.REPO_B_PATH }}/src/

      - name: "🟢 Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ═══════════════════════════════════════════════════
      # STAGE 2: Install Dependencies
      # ═══════════════════════════════════════════════════

      - name: "📦 Install Repo B dependencies"
        working-directory: ${{ env.REPO_B_PATH }}
        run: npm ci

      - name: "📦 Install MCP Server dependencies"
        working-directory: ./mcp-server
        run: npm ci

      - name: "🔨 Build MCP Server"
        working-directory: ./mcp-server
        run: npm run build

      # ═══════════════════════════════════════════════════
      # STAGE 3: Extract Context
      # ═══════════════════════════════════════════════════

      - name: "📊 Extract PR Diff"
        run: |
          echo "::group::Backend API Diff"
          git diff origin/main..HEAD -- src/server.ts > /tmp/backend-diff.patch
          cat /tmp/backend-diff.patch
          echo "::endgroup::"

          # Validate diff is non-empty
          if [ ! -s /tmp/backend-diff.patch ]; then
            echo "⚠️ No changes detected in src/server.ts"
            echo "SKIP_AEGIS=true" >> $GITHUB_ENV
          else
            DIFF_LINES=$(wc -l < /tmp/backend-diff.patch)
            echo "📝 Diff contains ${DIFF_LINES} lines"
          fi

      # ═══════════════════════════════════════════════════
      # STAGE 4: Install Bob
      # ═══════════════════════════════════════════════════

      - name: "🤖 Install IBM Bob 2.0 Shell"
        if: env.SKIP_AEGIS != 'true'
        run: |
          # IBM Bob 2.0 installation
          npm install -g @ibm/bob-shell 2>/dev/null || \
          npm install -g @ibm/bob-cli 2>/dev/null || \
          npm install -g bob-shell 2>/dev/null || \
          (echo "::warning::Bob Shell not found via npm — using direct API fallback" && echo "BOB_API_FALLBACK=true" >> $GITHUB_ENV)
          bob --version 2>/dev/null || bob-shell --version 2>/dev/null || echo "Bob CLI availability check complete"

      # ═══════════════════════════════════════════════════
      # STAGE 5: Agent + Validate Loop (up to 3 iterations)
      # Each iteration: run Bob → docker type-check → break on pass
      # or feed tsc errors back into the next prompt iteration.
      # ═══════════════════════════════════════════════════

      - name: "🔄 Aegis Sync Loop"
        if: env.SKIP_AEGIS != 'true'
        run: |
          set -o pipefail

          BACKEND_DIFF="$(cat /tmp/backend-diff.patch)"
          export BACKEND_DIFF
          TSC_ERRORS=""       # Empty on first iteration; populated on retry
          AEGIS_RESULT=""

          for ITER in 1 2 3; do
            echo "::group::Aegis iteration ${ITER}/3"
            IMAGE_TAG="aegis-type-check:${{ github.sha }}-iter-${ITER}"

            # ── Build prompt for this iteration (Python substitution — shell-safe) ──
            python3 - <<PYEOF
import os, pathlib
template   = pathlib.Path('./prompts/aegis-master-prompt.md').read_text()
diff       = os.environ.get('BACKEND_DIFF', '')
tsc_errors = os.environ.get('TSC_ERRORS', '')
result     = template.replace('\${BACKEND_DIFF}', diff).replace('\${TSC_ERRORS}', tsc_errors)
pathlib.Path('/tmp/aegis-prompt-iter-${ITER}.md').write_text(result)
PYEOF

            # ── Run Bob ──
            if [ "${BOB_API_FALLBACK}" = "true" ]; then
              echo "Iteration ${ITER}: running via IBM Bob API (curl fallback)..."
              curl -s -X POST "https://api.ibm.com/bob/v2/agent/run" \
                -H "Authorization: Bearer ${BOB_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "{
                  \"prompt\": $(python3 -c 'import sys,json; print(json.dumps(open("/tmp/aegis-prompt-iter-${ITER}.md").read()))'),
                  \"mcp_config\": $(cat ./mcp-config.json),
                  \"max_iterations\": 5
                }" > /tmp/bob-output-iter-${ITER}.json
              cat /tmp/bob-output-iter-${ITER}.json
            else
              bob shell --headless \
                --mcp-config ./mcp-config.json \
                --prompt "$(cat /tmp/aegis-prompt-iter-${ITER}.md)" \
                --max-iterations 5 \
                --timeout 300 2>&1 || \
              bob --headless \
                --mcp-config ./mcp-config.json \
                --prompt "$(cat /tmp/aegis-prompt-iter-${ITER}.md)" \
                --max-iterations 5 2>&1
            fi

            # ── Type-check inside Docker sandbox ──
            echo "Building validation image (${IMAGE_TAG})..."
            docker build --no-cache -t "${IMAGE_TAG}" ${{ env.REPO_B_PATH }}
            TYPE_CHECK_OUTPUT=$(docker run --rm "${IMAGE_TAG}" 2>&1)
            TYPE_CHECK_EXIT=$?
            echo "${TYPE_CHECK_OUTPUT}" | tee /tmp/type-check-output.txt

            echo "::endgroup::"

            if [ ${TYPE_CHECK_EXIT} -eq 0 ]; then
              echo "✅ Type-check passed on iteration ${ITER}"
              AEGIS_RESULT="SYNC_COMPLETE"
              echo "AEGIS_RESULT=SYNC_COMPLETE" >> $GITHUB_ENV
              break
            else
              echo "⚠️ Type-check failed on iteration ${ITER} — feeding errors back into next prompt"
              export TSC_ERRORS="${TYPE_CHECK_OUTPUT}"
            fi
          done

          # If all iterations failed, mark as failed and exit non-zero
          if [ "${AEGIS_RESULT}" != "SYNC_COMPLETE" ]; then
            echo "AEGIS_RESULT=FAILED" >> $GITHUB_ENV
            echo "❌ All iterations exhausted — type-check never passed"
            exit 1
          fi
        env:
          BOB_API_KEY: ${{ secrets.BOB_API_KEY }}
          REPO_B_PATH: ${{ env.REPO_B_PATH }}

      - name: "💬 Post Failure Comment on PR"
        if: failure() && env.SKIP_AEGIS != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TSC_OUTPUT=$(cat /tmp/type-check-output.txt 2>/dev/null || echo "(no output captured)")
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          COMMENT_BODY="## 🛡️ Aegis: Type-Check Failed on PR #${PR_NUMBER}

          @${PR_AUTHOR} — the automated frontend sync could not be validated. Manual intervention is required.

          **Backend PR:** #${PR_NUMBER}
          **Triggered by:** Changes in \`src/server.ts\`

          ### TypeScript Errors
          \`\`\`
          ${TSC_OUTPUT}
          \`\`\`

          ---
          *Powered by IBM Bob 2.0 + Model Context Protocol (MCP)*"

          gh pr comment "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body "${COMMENT_BODY}"

      - name: "🔍 Show Changes Made"
        if: env.SKIP_AEGIS != 'true'
        working-directory: ${{ env.REPO_B_PATH }}
        run: |
          echo "::group::Changes made by Aegis"
          git diff
          echo "::endgroup::"

      # ═══════════════════════════════════════════════════
      # STAGE 6: Create Frontend PR
      # ═══════════════════════════════════════════════════

      - name: "🚀 Push Changes & Create Frontend PR"
        if: env.SKIP_AEGIS != 'true'
        working-directory: ${{ env.REPO_B_PATH }}
        run: |
          # Configure git identity
          git config user.name "Project Aegis Bot"
          git config user.email "aegis-bot@noreply.github.com"

          # Check if any files were actually changed
          if git diff --quiet; then
            echo "⚠️ No file changes detected — skipping PR creation"
            exit 0
          fi

          # Use github.run_id for a globally unique branch name — eliminates timestamp collisions
          BRANCH="aegis/sync-pr${{ github.event.pull_request.number }}-${{ github.run_id }}"
          echo "Creating branch: ${BRANCH}"
          git checkout -b "${BRANCH}"

          # Stage and commit
          git add -A
          git commit -m "chore: sync frontend types with backend PR #${{ github.event.pull_request.number }}

          Automated by Project Aegis — Contract Sync Agent

          Backend PR: ${{ github.event.pull_request.html_url }}
          Changes detected in: src/server.ts
          Files updated: src/types.ts, src/schemas.ts
          Validation: npm run type-check ✅ passed"

          # Push to Repo B
          git push origin "${BRANCH}"
          echo "✅ Branch pushed to Repo B"

          # Idempotency guard — skip PR creation if one already exists for this branch
          EXISTING=$(gh pr list \
            --repo "${{ env.FRONTEND_REPO }}" \
            --head "${BRANCH}" \
            --json number \
            --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${EXISTING}" ]; then
            echo "⚠️ PR #${EXISTING} already exists for branch ${BRANCH} — skipping creation"
            echo "FRONTEND_PR_URL=$(gh pr view ${EXISTING} --repo ${{ env.FRONTEND_REPO }} --json url --jq '.url')" >> $GITHUB_ENV
            exit 0
          fi

          # Create Pull Request using GitHub CLI — capture URL for job summary
          FRONTEND_PR_URL=$(gh pr create \
            --repo "${{ env.FRONTEND_REPO }}" \
            --head "${BRANCH}" \
            --base "main" \
            --title "🛡️ Aegis: Sync types with backend PR #${{ github.event.pull_request.number }}" \
            --body "## 🛡️ Automated Contract Synchronization

          This PR was automatically generated by **Project Aegis**.

          ### 📋 What happened
          A breaking change was detected in the backend API ([PR #${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }})).

          Project Aegis analyzed the diff, updated the frontend TypeScript interfaces and Zod schemas, and validated the changes.

          ### 📁 Files Updated
          - \`src/types.ts\` — TypeScript interface updated
          - \`src/schemas.ts\` — Zod validation schema updated

          ### ✅ Validation
          - \`npm run type-check\` — **Passed**

          ### 🏗️ Architecture
          \`\`\`
          Backend PR → GitHub Action → IBM Bob 2.0 + MCP → Type-Check → Frontend PR
          \`\`\`

          ---
          *Powered by IBM Bob 2.0 + Model Context Protocol (MCP)*
          *Team: Aegis Enclave*")
          echo "✅ Frontend PR created: ${FRONTEND_PR_URL}"
          echo "FRONTEND_PR_URL=${FRONTEND_PR_URL}" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.FRONTEND_REPO_PAT }}

      # ═══════════════════════════════════════════════════
      # STAGE 7: Cleanup
      # ═══════════════════════════════════════════════════

      - name: "📋 Write Job Summary"
        if: always()
        run: |
          DIFF_LINES=$(wc -l < /tmp/backend-diff.patch 2>/dev/null || echo "0")
          AEGIS_STATUS="${AEGIS_RESULT:-SKIPPED}"
          FRONTEND_PR="${FRONTEND_PR_URL:-—}"

          {
            echo "## 🛡️ Project Aegis — Run Summary"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| **Run ID** | \`${{ github.run_id }}\` |"
            echo "| **Backend PR** | [#${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }}) |"
            echo "| **Triggered by** | \`${{ github.event.pull_request.user.login }}\` |"
            echo "| **Diff size** | ${DIFF_LINES} lines |"
            echo "| **Aegis result** | ${AEGIS_STATUS} |"
            echo "| **Frontend PR** | ${FRONTEND_PR} |"
            echo ""
            if [ "${AEGIS_STATUS}" = "SYNC_COMPLETE" ]; then
              echo "> ✅ Contract sync completed successfully."
            elif [ "${AEGIS_STATUS}" = "SKIPPED" ]; then
              echo "> ⏭️ No API changes detected — sync skipped."
            else
              echo "> ❌ Sync failed after all iterations. Manual intervention required."
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: "🧹 Cleanup"
        if: always()
        run: |
          # Remove all Docker images created by the sync loop iterations
          for ITER in 1 2 3; do
            docker rmi "aegis-type-check:${{ github.sha }}-iter-${ITER}" 2>/dev/null || true
          done
          echo "✅ Cleanup complete"
